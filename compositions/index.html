<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toy MIDI catalog</title>
    <style>
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #222;
      }
      h1 {
        font-size: 1.4rem;
        margin-bottom: 0.25rem;
      }
      .sub {
        color: #666;
        margin-top: 0;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 0.5rem 0.75rem;
        border: 1px solid #bbb;
        border-radius: 6px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }
      #filters {
        margin: 0.75rem 0 0.25rem;
      }
      .nav {
        font-size: 0.85rem;
        color: #666;
      }
      .nav a {
        color: inherit;
      }
      .writeup {
        font-size: 0.8rem;
        color: #666;
      }
      .chip {
        font: inherit;
        font-size: 0.8rem;
        padding: 0.1rem 0.55rem;
        border: 1px solid #ccc;
        border-radius: 999px;
        background: #f6f6f6;
        color: #444;
        cursor: pointer;
      }
      .chip:hover {
        border-color: #888;
      }
      .chip.active {
        background: #2f5fd0;
        border-color: #2f5fd0;
        color: #fff;
      }
      .chip .n {
        color: #999;
        margin-left: 0.25rem;
      }
      .chip.active .n {
        color: #cfdcff;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        padding: 0.6rem 0;
        border-bottom: 1px solid #eee;
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
      }
      .head a {
        font-weight: 600;
      }
      time {
        color: #888;
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      li p {
        margin: 0.15rem 0 0.3rem;
        color: #555;
      }
      #status {
        color: #666;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a
        href="https://github.com/hi-ogawa/llm-music-probe/tree/main/compositions"
        target="_blank"
        rel="noopener"
        >Catalog source</a
      >
      ·
      <a
        href="https://github.com/hi-ogawa/llm-music-probe"
        target="_blank"
        rel="noopener"
        >llm-music-probe</a
      >
    </nav>
    <h1>Toy MIDI catalog</h1>
    <p class="sub">
      Agent-composed pieces, newest first. Each name opens the project in Toy
      MIDI as an unsaved draft.
    </p>
    <input
      id="q"
      type="search"
      placeholder="Search names, descriptions and tags"
      autofocus
    />
    <div id="filters" class="tags"></div>
    <p id="status">Loading…</p>
    <ul id="list"></ul>
    <script>
      const CATALOG_URL = "catalog.json";
      const TOY_MIDI = "https://toy-midi.hiro18181.workers.dev/draft?src=";

      const q = document.getElementById("q");
      const filters = document.getElementById("filters");
      const list = document.getElementById("list");
      const status = document.getElementById("status");
      let entries = [];
      let activeTag = null;

      function el(tag, props, children = []) {
        const node = Object.assign(document.createElement(tag), props);
        node.append(...children);
        return node;
      }

      function toggleTag(tag) {
        activeTag = activeTag === tag ? null : tag;
        render();
      }

      function chip(tag, count) {
        const button = el(
          "button",
          {
            type: "button",
            className: tag === activeTag ? "chip active" : "chip",
            onclick: () => toggleTag(tag),
          },
          [tag],
        );
        if (count !== undefined)
          button.append(el("span", { className: "n", textContent: count }));
        return button;
      }

      function renderFilters() {
        const counts = new Map();
        for (const e of entries)
          for (const t of e.tags) counts.set(t, (counts.get(t) ?? 0) + 1);
        const tags = [...counts].sort(
          (a, b) => b[1] - a[1] || a[0].localeCompare(b[0]),
        );
        filters.replaceChildren(...tags.map(([t, n]) => chip(t, n)));
      }

      function render() {
        renderFilters();
        const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
        const shown = entries.filter((e) => {
          if (activeTag && !e.tags.includes(activeTag)) return false;
          const text =
            `${e.name} ${e.description} ${e.tags.join(" ")}`.toLowerCase();
          return terms.every((t) => text.includes(t));
        });
        list.replaceChildren(
          ...shown.map((e) =>
            el("li", {}, [
              el("div", { className: "head" }, [
                el("a", {
                  href: TOY_MIDI + encodeURIComponent(e.url),
                  target: "_blank",
                  rel: "noopener",
                  textContent: e.name,
                }),
                el("time", { dateTime: e.date, textContent: e.date }),
                ...(e.writeup
                  ? [
                      el("a", {
                        className: "writeup",
                        href: e.writeup,
                        target: "_blank",
                        rel: "noopener",
                        textContent: "write-up",
                      }),
                    ]
                  : []),
              ]),
              el("p", { textContent: e.description }),
              el(
                "div",
                { className: "tags" },
                e.tags.map((t) => chip(t)),
              ),
            ]),
          ),
        );
        status.textContent =
          `${shown.length} of ${entries.length} pieces` +
          (activeTag ? ` tagged "${activeTag}"` : "");
      }

      fetch(CATALOG_URL, { cache: "no-cache" })
        .then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then((data) => {
          entries = data
            .map((e) => ({ ...e, date: e.date ?? "", tags: e.tags ?? [] }))
            .sort((a, b) => b.date.localeCompare(a.date));
          render();
        })
        .catch((err) => {
          status.textContent = `Failed to load catalog.json: ${err.message}`;
        });

      q.addEventListener("input", render);
    </script>
  </body>
</html>
